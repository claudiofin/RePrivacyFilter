<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RePrivacyFilter</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --orange: #d29922;
    --purple: #bc8cff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  .header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 600;
  }

  .header h1 span { color: var(--accent); }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
  }

  .status-dot.off { background: var(--red); }

  .toggle-btn {
    padding: 6px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    transition: border-color 0.15s;
  }

  .toggle-btn:hover { border-color: var(--accent); }
  .toggle-btn.active { border-color: var(--green); background: #1a2e1a; }

  .container { max-width: 1100px; margin: 0 auto; padding: 20px 24px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }

  .stat-card .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .value { font-size: 24px; font-weight: 600; margin-top: 4px; }
  .stat-card .value.accent { color: var(--accent); }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.orange { color: var(--orange); }

  .log-list { display: flex; flex-direction: column; gap: 8px; }

  .log-entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .log-entry:hover { border-color: var(--accent); }

  .log-summary {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .log-summary .provider {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .provider.openai { background: #1a3a2a; color: var(--green); }
  .provider.anthropic { background: #2a1a3a; color: var(--purple); }

  .log-summary .endpoint {
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .log-summary .pii-badge {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #3a2a1a;
    color: var(--orange);
    font-weight: 500;
  }

  .log-summary .pii-badge.clean {
    background: #1a2e1a;
    color: var(--green);
  }

  .log-summary .timing {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-dim);
    font-family: 'SF Mono', Menlo, monospace;
  }

  .log-summary .time-ago {
    font-size: 12px;
    color: var(--text-dim);
  }

  .log-detail {
    display: none;
    border-top: 1px solid var(--border);
    padding: 16px;
  }

  .log-entry.expanded .log-detail { display: block; }

  .diff-view {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 12px;
  }

  .diff-pane {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 300px;
    overflow-y: auto;
    line-height: 1.6;
  }

  .diff-pane .pane-label {
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    display: block;
  }

  .pii-highlight {
    background: rgba(210, 153, 34, 0.2);
    border-radius: 2px;
    padding: 1px 2px;
    color: var(--orange);
  }

  .placeholder-tag {
    background: rgba(88, 166, 255, 0.15);
    border-radius: 2px;
    padding: 1px 4px;
    color: var(--accent);
    font-weight: 500;
  }

  .reverse-map {
    margin-top: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
  }

  .reverse-map .pane-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    display: block;
  }

  .map-entry {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    font-family: 'SF Mono', Menlo, monospace;
    padding: 4px 0;
  }

  .map-entry .tag { color: var(--accent); }
  .map-entry .arrow { color: var(--text-dim); }
  .map-entry .original { color: var(--orange); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  .empty-state h2 { font-size: 16px; margin-bottom: 8px; color: var(--text); }

  .refresh-hint {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    padding: 8px;
  }
</style>
</head>
<body>

<div class="header">
  <h1><span>Re</span>PrivacyFilter</h1>
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText" style="font-size:13px">Connecting...</span>
    <button class="toggle-btn" id="toggleBtn" onclick="toggleFilter()">Toggle</button>
  </div>
</div>

<div class="container">
  <div class="stats">
    <div class="stat-card">
      <div class="label">Total Requests</div>
      <div class="value accent" id="statTotal">0</div>
    </div>
    <div class="stat-card">
      <div class="label">PII Detected</div>
      <div class="value orange" id="statPii">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Avg Filter Time</div>
      <div class="value green" id="statFilter">0ms</div>
    </div>
    <div class="stat-card">
      <div class="label">Avg Upstream</div>
      <div class="value" id="statUpstream">0ms</div>
    </div>
  </div>

  <div class="log-list" id="logList">
    <div class="empty-state">
      <h2>No requests yet</h2>
      <p>Configure your client to use http://127.0.0.1:8990/v1/ as the API base URL</p>
    </div>
  </div>

  <div id="pagination" style="display:none; text-align:center; padding:16px; gap:12px; align-items:center; justify-content:center;">
    <button class="toggle-btn" id="prevBtn" onclick="changePage(-1)">Previous</button>
    <span id="pageInfo" style="font-size:13px; color:var(--text-dim);"></span>
    <button class="toggle-btn" id="nextBtn" onclick="changePage(1)">Next</button>
  </div>
</div>

<script>
const API = '';
let TOKEN = '';
const authHeaders = () => TOKEN ? {'X-Re-Token': TOKEN} : {};
let logs = [];
let expandedIds = new Set();
const PAGE_SIZE = 20;
let currentPage = 0;
let totalLogs = 0;

async function fetchStatus() {
  try {
    const r = await fetch(`${API}/proxy/status`, {headers: authHeaders()});
    const d = await r.json();
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    const btn = document.getElementById('toggleBtn');
    dot.className = 'status-dot' + (d.enabled ? '' : ' off');
    txt.textContent = d.enabled ? 'Filter ON' : 'Filter OFF';
    btn.className = 'toggle-btn' + (d.enabled ? ' active' : '');
    btn.textContent = d.enabled ? 'ON' : 'OFF';
  } catch(e) {
    document.getElementById('statusText').textContent = 'Disconnected';
    document.getElementById('statusDot').className = 'status-dot off';
  }
}

async function toggleFilter() {
  await fetch(`${API}/proxy/toggle`, { method: 'POST', headers: authHeaders() });
  fetchStatus();
}

function timeAgo(ts) {
  const s = Math.floor(Date.now()/1000 - ts);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightPii(text) {
  return escapeHtml(text).replace(
    /&lt;([A-Z_]+_\d+)&gt;/g,
    '<span class="placeholder-tag">&lt;$1&gt;</span>'
  );
}

function reconstructOriginal(redactedStr, rmap) {
  let text = redactedStr;
  for (const [tag, original] of Object.entries(rmap)) {
    text = text.split(tag).join(original);
  }
  return text;
}

function highlightOriginalPii(text, rmap) {
  let html = escapeHtml(text);
  for (const [, original] of Object.entries(rmap)) {
    const escaped = escapeHtml(original);
    html = html.split(escaped).join(`<span class="pii-highlight">${escaped}</span>`);
  }
  return html;
}

function formatJson(str) {
  try {
    const obj = JSON.parse(str);
    const msgs = obj.messages || [];
    if (msgs.length > 0) {
      return msgs.map(m => {
        const c = typeof m.content === 'string' ? m.content :
          (Array.isArray(m.content) ? m.content.filter(b=>b.type==='text').map(b=>b.text).join('\n') : JSON.stringify(m.content));
        return `[${m.role}]\n${c}`;
      }).join('\n\n');
    }
    if (obj.prompt) return obj.prompt;
    return str;
  } catch(e) { return str; }
}

function renderLogs(data) {
  const list = document.getElementById('logList');
  if (!data.length) return;

  list.innerHTML = data.map(d => {
    const provClass = d.provider || 'openai';
    const piiClass = (d.pii_count||0) > 0 ? '' : ' clean';
    let rmap = {};
    try { rmap = JSON.parse(d.reverse_map || '{}'); } catch(e) {}
    const mapEntries = Object.entries(rmap);
    const redacted = formatJson(d.redacted_body || '');
    const original = mapEntries.length > 0
      ? formatJson(reconstructOriginal(d.redacted_body || '', rmap))
      : redacted;

    return `
    <div class="log-entry${expandedIds.has(d.id) ? ' expanded' : ''}" onclick="toggleEntry(this, '${escapeHtml(d.id)}')">
      <div class="log-summary">
        <span class="provider ${provClass}">${escapeHtml(provClass)}</span>
        <span class="endpoint">${escapeHtml(d.endpoint || '')}</span>
        <span class="pii-badge${piiClass}">${(d.pii_count||0)} PII</span>
        <span class="timing">${Math.round(d.filter_ms||0)}ms filter / ${Math.round(d.upstream_ms||0)}ms upstream</span>
        <span class="time-ago">${timeAgo(d.timestamp)}</span>
      </div>
      <div class="log-detail">
        <div class="diff-view">
          <div class="diff-pane">
            <span class="pane-label">Original (intercepted)</span>
${highlightOriginalPii(original, rmap)}</div>
          <div class="diff-pane">
            <span class="pane-label">Sanitized (sent upstream)</span>
${highlightPii(redacted)}</div>
        </div>
        ${mapEntries.length > 0 ? `
        <div class="reverse-map">
          <span class="pane-label">PII Mapping (local only)</span>
          ${mapEntries.map(([k,v]) => `
          <div class="map-entry">
            <span class="tag">${escapeHtml(k)}</span>
            <span class="arrow">&rarr;</span>
            <span class="original">${escapeHtml(v)}</span>
          </div>`).join('')}
        </div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function toggleEntry(el, id) {
  el.classList.toggle('expanded');
  if (el.classList.contains('expanded')) {
    expandedIds.add(id);
  } else {
    expandedIds.delete(id);
  }
}

async function fetchLogs() {
  try {
    const offset = currentPage * PAGE_SIZE;
    const r = await fetch(`${API}/proxy/logs?limit=${PAGE_SIZE}&offset=${offset}`, {headers: authHeaders()});
    logs = await r.json();
    renderLogs(logs);
    updatePagination();
  } catch(e) {}
}

async function fetchStats() {
  try {
    const r = await fetch(`${API}/proxy/stats`, {headers: authHeaders()});
    const s = await r.json();
    totalLogs = s.total || 0;
    document.getElementById('statTotal').textContent = totalLogs;
    document.getElementById('statPii').textContent = s.pii || 0;
    document.getElementById('statFilter').textContent = `${Math.round(s.avg_filter || 0)}ms`;
    document.getElementById('statUpstream').textContent = `${Math.round(s.avg_upstream || 0)}ms`;
  } catch(e) {}
}

function updatePagination() {
  const pag = document.getElementById('pagination');
  const totalPages = Math.max(1, Math.ceil(totalLogs / PAGE_SIZE));
  if (totalLogs <= PAGE_SIZE) {
    pag.style.display = 'none';
    return;
  }
  pag.style.display = 'flex';
  document.getElementById('pageInfo').textContent = `Page ${currentPage + 1} of ${totalPages}`;
  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('nextBtn').disabled = currentPage >= totalPages - 1;
}

function changePage(delta) {
  const totalPages = Math.ceil(totalLogs / PAGE_SIZE);
  currentPage = Math.max(0, Math.min(currentPage + delta, totalPages - 1));
  fetchLogs();
}

fetchStatus();
fetchStats();
fetchLogs();
setInterval(fetchStatus, 5000);
setInterval(fetchStats, 5000);
setInterval(fetchLogs, 3000);
</script>
</body>
</html>
